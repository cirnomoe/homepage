<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <meta name="description" content="cirno@rime.moe - Crystalline sanctuary, subcooled physics, eBPF & isolated autonomous network.">
  <title>cirno@rime.moe: ~ (zsh)</title>
  <style>
    /* ==========================================================================
       Nord / Deep Ice Theme Design System
       ========================================================================== */
    :root {
      --bg-color: #0d1117;
      --card-bg: rgba(22, 27, 34, 0.95);
      --card-border: rgba(125, 207, 255, 0.18);
      --card-glow: rgba(125, 207, 255, 0.07);

      --text-white: #e6edf3;
      --text-muted: #8b949e;
      --text-cyan: #7dcfff;
      --text-blue: #79c0ff;
      --text-green: #7ee787;
      --text-teal: #56d4dd;
      --text-red: #ff7b72;
      --text-yellow: #ffbd2e;

      --font-mono: "JetBrains Mono", "Fira Code", "Cascadia Code", Menlo, Monaco, Consolas, "Courier New", monospace;
      --terminal-radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-color);
      font-family: var(--font-mono);
      color: var(--text-white);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Ambient Background Effects */
    #frost-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .ambient-grid {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background:
        radial-gradient(circle at 50% 12%, rgba(125, 207, 255, 0.08) 0%, transparent 60%),
        radial-gradient(circle at 85% 85%, rgba(86, 212, 221, 0.04) 0%, transparent 50%),
        linear-gradient(rgba(125, 207, 255, 0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(125, 207, 255, 0.015) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 36px 36px, 36px 36px;
    }

    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      box-shadow: inset 0 0 120px rgba(0, 0, 0, 0.7);
    }

    /* Main Terminal Shell */
    .terminal-container {
      position: relative;
      z-index: 3;
      width: min(940px, calc(100vw - 32px));
      height: min(650px, calc(100dvh - 32px));
      display: flex;
      flex-direction: column;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .terminal-container.fullscreen {
      width: 100vw;
      height: 100dvh;
      border-radius: 0;
    }

    .terminal-container.minimized .terminal-body,
    .terminal-container.minimized .quick-chips-bar {
      display: none;
    }

    .terminal-container.minimized {
      height: auto;
    }

    .terminal-card {
      width: 100%;
      height: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--terminal-radius);
      box-shadow:
        0 24px 60px -12px rgba(0, 0, 0, 0.8),
        0 0 35px var(--card-glow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .terminal-container.fullscreen .terminal-card {
      border-radius: 0;
      border: none;
    }

    /* macOS Window Header Bar */
    .terminal-header {
      height: 40px;
      min-height: 40px;
      background: rgba(13, 17, 23, 0.88);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      user-select: none;
    }

    .traffic-lights {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 80px;
    }

    .light-btn {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      position: relative;
      display: inline-block;
      padding: 0;
      transition: transform 0.15s ease, filter 0.15s ease;
      outline: none;
    }

    .light-btn:hover {
      filter: brightness(1.2);
      transform: scale(1.12);
    }

    .light-btn.close { background-color: #ff5f56; }
    .light-btn.min { background-color: #ffbd2e; }
    .light-btn.max { background-color: #27c93f; }

    .terminal-title {
      font-size: 13px;
      color: var(--text-muted);
      letter-spacing: 0.4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
    }

    .telemetry-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 80px;
      justify-content: flex-end;
      font-size: 11px;
      color: var(--text-cyan);
    }

    .telemetry-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--text-cyan);
      box-shadow: 0 0 8px var(--text-cyan);
      animation: pulse-dot 2.5s infinite ease-in-out;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 0.45; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    /* Terminal Output & Stream Body */
    .terminal-body {
      flex: 1;
      padding: 18px 22px;
      overflow-y: auto;
      overflow-x: hidden;
      font-size: 13.5px;
      line-height: 1.6;
      cursor: text;
      scrollbar-width: thin;
      scrollbar-color: rgba(125, 207, 255, 0.2) transparent;
      scroll-behavior: smooth;
    }

    .terminal-body::-webkit-scrollbar {
      width: 6px;
    }

    .terminal-body::-webkit-scrollbar-track {
      background: transparent;
    }

    .terminal-body::-webkit-scrollbar-thumb {
      background: rgba(125, 207, 255, 0.18);
      border-radius: 4px;
    }

    .terminal-body::-webkit-scrollbar-thumb:hover {
      background: rgba(125, 207, 255, 0.38);
    }

    /* Terminal Content Typographies */
    .terminal-line {
      margin-bottom: 5px;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .ascii-banner {
      font-family: inherit;
      font-size: clamp(7.5px, 2.2vw, 12px);
      line-height: 1.15;
      color: var(--text-cyan);
      text-shadow: 0 0 12px rgba(125, 207, 255, 0.4);
      white-space: pre;
      margin: 4px 0 12px 0;
      user-select: text;
      overflow-x: auto;
    }

    .boot-log {
      color: var(--text-muted);
      margin-bottom: 12px;
      font-size: 12px;
      line-height: 1.5;
    }

    .boot-log .log-time {
      color: var(--text-blue);
      margin-right: 6px;
    }

    .boot-log .log-highlight {
      color: var(--text-cyan);
    }

    .welcome-tip {
      color: var(--text-white);
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px dashed rgba(125, 207, 255, 0.16);
      font-size: 13px;
    }

    .prompt {
      display: inline;
      user-select: none;
      font-weight: 600;
    }

    .prompt-user { color: var(--text-blue); }
    .prompt-sep { color: var(--text-muted); }
    .prompt-path { color: var(--text-green); }
    .prompt-symbol { color: var(--text-cyan); margin-right: 8px; }

    .cmd-executed {
      color: #ffffff;
      font-weight: 500;
    }

    .output-block {
      margin: 4px 0 14px 0;
      color: var(--text-white);
    }

    .output-cyan { color: var(--text-cyan); }
    .output-muted { color: var(--text-muted); }
    .output-blue { color: var(--text-blue); }
    .output-green { color: var(--text-green); }
    .output-red { color: var(--text-red); }
    .output-yellow { color: var(--text-yellow); }

    .terminal-link {
      color: var(--text-teal);
      text-decoration: none;
      border-bottom: 1px dashed rgba(86, 212, 221, 0.45);
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .terminal-link:hover {
      color: #ffffff;
      border-bottom-color: #ffffff;
      text-shadow: 0 0 8px rgba(86, 212, 221, 0.85);
    }

    /* Active Input Line Container */
    .input-line {
      position: relative;
      display: flex;
      align-items: baseline;
      min-height: 24px;
      cursor: text;
    }

    .input-line-inner {
      display: inline-flex;
      align-items: baseline;
      flex: 1;
      position: relative;
    }

    .display-text {
      white-space: pre-wrap;
      word-break: break-all;
      color: #ffffff;
    }

    /* True Terminal Inverted Solid Block Cursor with Blink Animation */
    .block-cursor {
      display: inline-block;
      min-width: 0.55em;
      height: 1.16em;
      background-color: var(--text-cyan);
      color: var(--bg-color);
      vertical-align: -0.16em;
      margin: 0 1px;
      font-weight: 700;
      text-align: center;
      line-height: 1.16em;
      box-shadow: 0 0 8px rgba(125, 207, 255, 0.7);
      animation: blink 1s step-end infinite;
      user-select: none;
    }

    .block-cursor.typing {
      animation: none;
      opacity: 1;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Real Invisible Input Element */
    .cli-input {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      color: transparent;
      background: transparent;
      border: none;
      outline: none;
      caret-color: transparent;
      /* CRITICAL: Must be at least 16px to prevent iOS Safari auto-zooming */
      font-size: 16px !important;
      font-family: inherit;
      padding: 0;
      margin: 0;
      z-index: 2;
    }

    /* Quick Chips Bar */
    .quick-chips-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      white-space: nowrap;
      padding: 10px 16px;
      background: rgba(13, 17, 23, 0.96);
      border-top: 1px solid rgba(125, 207, 255, 0.12);
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      user-select: none;
    }

    .quick-chips-bar::-webkit-scrollbar {
      display: none;
    }

    .chips-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      margin-right: 4px;
      flex-shrink: 0;
    }

    .chip {
      background: rgba(125, 207, 255, 0.08);
      border: 1px solid rgba(125, 207, 255, 0.22);
      color: var(--text-cyan);
      font-family: inherit;
      font-size: 12px;
      padding: 5px 13px;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.15s ease-out;
      flex-shrink: 0;
      outline: none;
    }

    .chip:hover {
      background: rgba(125, 207, 255, 0.22);
      border-color: var(--text-blue);
      color: #ffffff;
      box-shadow: 0 0 10px rgba(125, 207, 255, 0.38);
      transform: translateY(-1px);
    }

    .chip:active {
      transform: translateY(1px);
      background: rgba(125, 207, 255, 0.32);
    }

    /* JSON & Key-Value Syntax Highlighting */
    .json-key { color: var(--text-blue); }
    .json-string { color: var(--text-green); }
    .json-bracket { color: var(--text-muted); }

    /* Responsive Adaptation for Mobile */
    @media (max-width: 640px) {
      .terminal-container {
        width: 100vw;
        height: 100dvh;
        border-radius: 0;
      }

      .terminal-card {
        border-radius: 0;
        border: none;
      }

      .terminal-body {
        padding: 12px 14px;
        font-size: 12.5px;
      }

      .quick-chips-bar {
        padding: 8px 12px;
      }
    }
  </style>
</head>
<body>

  <script>
    (function () {
      'use strict';

      // --- Subtle Ambient Frost Particle Background ---
      const canvas = document.getElementById('frost-canvas');
      const ctx = canvas.getContext('2d');
      let particles = [];

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      const PARTICLE_COUNT = 32;
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        particles.push({
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          radius: Math.random() * 1.5 + 0.5,
          speedY: Math.random() * 0.25 + 0.08,
          speedX: (Math.random() - 0.5) * 0.15,
          alpha: Math.random() * 0.4 + 0.1
        });
      }

      function renderFrost() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#7dcfff';

        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.globalAlpha = p.alpha;
          ctx.fill();

          p.y += p.speedY;
          p.x += p.speedX;

          if (p.y > canvas.height) {
            p.y = -5;
            p.x = Math.random() * canvas.width;
          }
          if (p.x > canvas.width) p.x = 0;
          if (p.x < 0) p.x = canvas.width;
        }

        ctx.globalAlpha = 1.0;
        requestAnimationFrame(renderFrost);
      }
      requestAnimationFrame(renderFrost);

      // --- DOM Elements ---
      const terminalContainer = document.getElementById('terminal-container');
      const terminalBody = document.getElementById('terminal-body');
      const historyStream = document.getElementById('history-stream');
      const cliInput = document.getElementById('cli-input');
      const displayBefore = document.getElementById('display-before');
      const displayAfter = document.getElementById('display-after');
      const blockCursor = document.getElementById('block-cursor');
      const quickChipsBar = document.getElementById('quick-chips-bar');

      const btnClose = document.getElementById('btn-close');
      const btnMin = document.getElementById('btn-min');
      const btnMax = document.getElementById('btn-max');

      // --- State ---
      const commandHistory = [];
      let historyIndex = -1;
      let currentDraft = '';
      let isSuspended = false;
      let typingTimer = null;

      // Available commands for auto-completion
      const AVAILABLE_COMMANDS = [
        'help',
        'about',
        'skills',
        'tech',
        'status',
        'links',
        'cirno',

      // --- Helper Utilities ---
      function escapeHtml(text) {
        return String(text)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')

      }

        requestAnimationFrame(() => {
          terminalBody.scrollTop = terminalBody.scrollHeight;

        if (!isSuspended) {
          cliInput.focus();
        }
      }

      function syncDisplay() {
        const val = cliInput.value;
        const selStart = cliInput.selectionStart ?? val.length;
        const charAtCursor = val.slice(selStart, selStart + 1);

        displayBefore.textContent = val.slice(0, selStart);

        if (charAtCursor) {
          // Inverted display of character directly under block cursor
          blockCursor.textContent = charAtCursor;
          displayAfter.textContent = val.slice(selStart + 1);
        } else {
          // At end of line: block cursor renders non-breaking space
          blockCursor.innerHTML = '&nbsp;';
          displayAfter.textContent = '';
        }

        // Keep cursor solidly visible while typing
        blockCursor.classList.add('typing');
        clearTimeout(typingTimer);
        typingTimer = setTimeout(() => {
          blockCursor.classList.remove('typing');

        },

        skills: function () {

      // --- Execute Command Flow ---
      function executeCommand(rawInput) {
        const trimmed = rawInput.trim();
        const cmdParts = trimmed.split(/\s+/);
        const mainCmd = cmdParts[0].toLowerCase();

        // 1. Render executed line to history stream
        const historyLine = document.createElement('div');
        historyLine.className = 'terminal-line';
        historyLine.innerHTML = `<span class="prompt"><span class="prompt-user">cirno@rime.moe</span><span class="prompt-sep">:</span><span class="prompt-path">~</span><span class="prompt-symbol">$</span></span><span class="cmd-executed">${escapeHtml(rawInput)}</span>`;
        historyStream.appendChild(historyLine);

        // 2. Add to history buffer
        if (trimmed.length > 0 && commandHistory[commandHistory.length - 1] !== trimmed) {
          commandHistory.push(trimmed);
        }
        historyIndex = -1;
        currentDraft = '';

        // 3. Process command output
        if (trimmed.length > 0) {
          if (Object.prototype.hasOwnProperty.call(COMMANDS, mainCmd)) {
            const resultHtml = COMMANDS[mainCmd](cmdParts.slice(1));
            if (resultHtml !== null) {
              const outputElem = document.createElement('div');
              outputElem.innerHTML = resultHtml;
              historyStream.appendChild(outputElem);
            }
          } else {
            const notFound = document.createElement('div');
            notFound.className = 'terminal-line output-red';
            notFound.textContent = `command not found: ${mainCmd}. Type "help" for a list of commands.`;
            historyStream.appendChild(notFound);
          }
        }

        // 4. Reset input
        cliInput.value = '';
        syncDisplay();
        scrollToBottom();
      }

        const bootHtml = `

        historyStream.innerHTML = bootHtml;
        scrollToBottom();
      }

      // --- Event Listeners ---

      // 1. Text Selection Safeguard:
      // Clicking empty terminal space focuses input UNLESS user is selecting text to copy
      terminalBody.addEventListener('click', (e) => {
        const selection = window.getSelection();
        if (selection && selection.toString().length > 0) {
          // User is highlighting text to copy; DO NOT steal focus
          return;
        }
        if (e.target.closest('a, button, .chip')) {
          return;
        }
        focusCli();
      });

      // 2. Real Input Keydown Handler
      cliInput.addEventListener('keydown', (e) => {
        // IME composition check: do not execute during Chinese / Japanese composition
        if (e.isComposing || e.keyCode === 229) {
          return;
        }

        // Ctrl + L -> Clear screen
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'l') {
          e.preventDefault();
          executeCommand('clear');
          return;
        }

        // Ctrl + C -> Abort line
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c') {
          e.preventDefault();
          const historyLine = document.createElement('div');
          historyLine.className = 'terminal-line';
          historyLine.innerHTML = `<span class="prompt"><span class="prompt-user">cirno@rime.moe</span><span class="prompt-sep">:</span><span class="prompt-path">~</span><span class="prompt-symbol">$</span></span><span class="cmd-executed">${escapeHtml(cliInput.value)}^C</span>`;
          historyStream.appendChild(historyLine);
          cliInput.value = '';
          currentDraft = '';
          historyIndex = -1;
          syncDisplay();
          scrollToBottom();
          return;
        }

        // Enter -> Execute
        if (e.key === 'Enter') {
          e.preventDefault();
          executeCommand(cliInput.value);
          return;
        }

        // Up Arrow -> History back
        if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (commandHistory.length === 0) return;
          if (historyIndex === -1) {
            currentDraft = cliInput.value;
            historyIndex = commandHistory.length - 1;
          } else if (historyIndex > 0) {
            historyIndex--;
          }
          cliInput.value = commandHistory[historyIndex] || '';
          cliInput.selectionStart = cliInput.selectionEnd = cliInput.value.length;
          syncDisplay();
          return;
        }

        // Down Arrow -> History forward
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (historyIndex !== -1) {
            if (historyIndex < commandHistory.length - 1) {
              historyIndex++;
              cliInput.value = commandHistory[historyIndex];
            } else {
              historyIndex = -1;
              cliInput.value = currentDraft;
            }
            cliInput.selectionStart = cliInput.selectionEnd = cliInput.value.length;
            syncDisplay();
          }
          return;
        }

        // Tab -> Auto-completion (Commands & Filenames)
        if (e.key === 'Tab') {
          e.preventDefault();
          const currentVal = cliInput.value.trimStart();
          if (!currentVal) return;

          // Context 1: Auto-complete filenames when typing "cat <file>"
          if (currentVal.startsWith('cat ')) {
            const prefix = currentVal.slice(4).trimStart();
            const fileNames = Object.keys(VIRTUAL_FS);
            const matches = fileNames.filter(fn => fn.startsWith(prefix));
            if (matches.length === 1) {
              cliInput.value = 'cat ' + matches[0] + ' ';
              cliInput.selectionStart = cliInput.selectionEnd = cliInput.value.length;
              syncDisplay();
            } else if (matches.length > 1) {
              const hintLine = document.createElement('div');
              hintLine.className = 'terminal-line output-cyan';
              hintLine.textContent = matches.join('   ');
              historyStream.appendChild(hintLine);
              scrollToBottom();
            }
            return;
          }

          // Context 2: Auto-complete command names
          const matches = AVAILABLE_COMMANDS.filter(cmd => cmd.startsWith(currentVal.toLowerCase()));
          if (matches.length === 1) {
            cliInput.value = matches[0] + ' ';
            cliInput.selectionStart = cliInput.selectionEnd = cliInput.value.length;
            syncDisplay();
          } else if (matches.length > 1) {
            // Print match suggestions
            const hintLine = document.createElement('div');
            hintLine.className = 'terminal-line output-muted';
            hintLine.textContent = matches.join('   ');
            historyStream.appendChild(hintLine);
            scrollToBottom();
          }
          return;
        }

        // Sync display after other keys
        setTimeout(syncDisplay, 0);
      });

      cliInput.addEventListener('input', syncDisplay);
      cliInput.addEventListener('keyup', syncDisplay);
      cliInput.addEventListener('select', syncDisplay);
      cliInput.addEventListener('compositionupdate', syncDisplay);
      cliInput.addEventListener('compositionend', syncDisplay);

      // 3. Quick Chips Handler
      quickChipsBar.addEventListener('click', (e) => {
        const btn = e.target.closest('.chip');
        if (!btn) return;
        const cmd = btn.getAttribute('data-cmd');
        if (cmd) {
          executeCommand(cmd);
          focusCli();
        }
      });

      // 4. macOS Traffic Lights Control
      btnClose.addEventListener('click', () => {
        isSuspended = !isSuspended;
        if (isSuspended) {
          historyStream.innerHTML += `<div class="terminal-line output-yellow">[Process suspended. Terminal in cryogenic hibernation. Click red dot to wake.]</div>`;
          cliInput.blur();
        } else {
          historyStream.innerHTML += `<div class="terminal-line output-green">[Process resumed. Thermal equilibrium restored.]</div>`;
          focusCli();
        }
        scrollToBottom();
      });

      btnMin.addEventListener('click', () => {
        terminalContainer.classList.toggle('minimized');
      });

      btnMax.addEventListener('click', () => {
        terminalContainer.classList.toggle('fullscreen');
        scrollToBottom();
      });

      // Window resize re-centering
      window.addEventListener('resize', scrollToBottom);

      // --- Initialize ---
      printBootSequence();
      focusCli();
      syncDisplay();
    })();
